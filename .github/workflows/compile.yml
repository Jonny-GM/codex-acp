name: Compile

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - Android ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: x86_64-linux-android
            abi: x86_64

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ubuntu-android-${{ matrix.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-android-${{ matrix.target }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ubuntu-android-${{ matrix.target }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-android-${{ matrix.target }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ubuntu-android-${{ matrix.target }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-android-${{ matrix.target }}-cargo-target-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      # rusty_v8 (pulled in by codex-code-mode -> codex-core) ships no Android
      # prebuilt, so point its build script at our own hosted static lib. The
      # archive must be published by the prebuild-v8-android workflow first.
      - name: Determine prebuilt V8 version
        id: v8ver
        run: |
          version=$(awk '/^name = "v8"$/{getline; print; exit}' Cargo.lock \
            | sed -E 's/version = "(.+)"/\1/')
          if [ -z "$version" ]; then
            echo "Could not determine v8 version from Cargo.lock" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        env:
          RUSTY_V8_ARCHIVE: https://github.com/${{ github.repository }}/releases/download/librusty_v8-v${{ steps.v8ver.outputs.version }}/librusty_v8_release_${{ matrix.target }}.a.gz
        run: cargo ndk -t ${{ matrix.abi }} build --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.target }}-release
          path: |
            target/${{ matrix.target }}/release/codex-acp
