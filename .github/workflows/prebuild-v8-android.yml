name: Prebuild librusty_v8 (Android)

# codex-code-mode (a hard dependency of codex-core) pulls in the `v8` crate,
# and denoland/rusty_v8 publishes no Android static-lib prebuilt. This workflow
# builds librusty_v8 from source for the Android targets once per v8 version and
# publishes the archives as a release, which the Compile workflow then consumes
# via RUSTY_V8_ARCHIVE.
#
# Run manually (Actions -> Prebuild librusty_v8 (Android) -> Run workflow) after
# the v8 version in Cargo.lock changes. The build is heavy (V8 from source,
# ~1-2h and tens of GB of disk per target).

on:
  workflow_dispatch:
  # The manual "Run workflow" dispatch has been failing to queue on this repo.
  # Pushing to this dedicated branch is an alternate, equivalent trigger; the
  # branch only exists to start this build, nothing merges from it.
  push:
    branches: [prebuild-v8]

permissions:
  contents: write

jobs:
  build:
    name: Prebuild librusty_v8 - ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a

    steps:
      - uses: actions/checkout@v4

      # V8 from source needs a lot of free space. Keep /usr/local/lib/android
      # so the later setup-android step can write into the preinstalled SDK
      # location without hitting EACCES on its parent dir.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ninja-build curl unzip lsb-release wget software-properties-common gnupg
          # rusty_v8's bindgen step requires Clang 19+.
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          echo "LIBCLANG_PATH=/usr/lib/llvm-19/lib" >> "$GITHUB_ENV"

      # Per rusty_v8 issue #1895 suggestion: drive the build through cargo-ndk
      # with ANDROID_NDK_HOME set, so the v8 build script's Android code path
      # picks up a real NDK location instead of falling through to a default
      # config that pulls in unbundled chromium build/android/* targets.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      # The v8 build script fetches gn/ninja from Chromium's *legacy* CIPD
      # Cloud-Endpoints API (tools/ninja_gn_binaries.py -> /_ah/api/...), which
      # is deprecated and fails. It skips that download entirely when both the
      # GN and NINJA env vars point at binaries (and need_gn_ninja_download
      # ignores anything under depot_tools, so we must supply our own gn).
      # Building gn from source is small and avoids the broken endpoint; every
      # other download in the build uses direct GCS/git and works on a runner.
      - name: Provide gn and ninja
        run: |
          # Full clone (not --depth 1): gn's build/gen.py runs
          # `git describe --match initial-commit` to derive its version, which
          # needs the tag history a shallow clone omits.
          git clone https://gn.googlesource.com/gn /tmp/gn-src
          cd /tmp/gn-src
          python3 build/gen.py
          ninja -C out gn
          echo "GN=/tmp/gn-src/out/gn" >> "$GITHUB_ENV"
          echo "NINJA=$(command -v ninja)" >> "$GITHUB_ENV"

      - name: Determine v8 version
        id: v8ver
        run: |
          version=$(awk '/^name = "v8"$/{getline; print; exit}' Cargo.lock \
            | sed -E 's/version = "(.+)"/\1/')
          if [ -z "$version" ]; then
            echo "Could not determine v8 version from Cargo.lock" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Builds librusty_v8.a from source for the target. The v8 build script
      # downloads its own NDK and configures the Android gn args. We only need
      # the static archive; the consuming build uses the bindings shipped with
      # the v8 crate, so a bindgen failure here is non-fatal as long as the
      # archive was produced.
      # The v8 crate ships an incomplete chromium build/android tree. The
      # //v8/tools/BUILD.gn target lists `data_deps = [ "//build/android:test_runner_py" ]`,
      # which transitively pulls in python_library targets whose pydeps_file
      # references aren't bundled in the crate. We never run the test runner,
      # so drop that one data_deps line; it eliminates the whole tree of
      # missing-file errors at gn gen.
      - name: Patch v8 crate to drop test_runner_py data_deps
        env:
          V8_FROM_SOURCE: "1"
        run: |
          cargo fetch --target ${{ matrix.target }}
          v8_src=$(find ~/.cargo/registry/src -maxdepth 3 -type d -name "v8-147.4.0" | head -1)
          if [ -z "$v8_src" ]; then
            echo "Could not find v8 crate source" >&2
            exit 1
          fi
          echo "Found v8 source at: $v8_src"
          target_file="$v8_src/v8/tools/BUILD.gn"
          if [ ! -f "$target_file" ]; then
            echo "Expected $target_file not found" >&2
            exit 1
          fi
          echo "Before:"
          grep -n 'test_runner_py\|data_deps' "$target_file" || true
          sed -i 's|"//build/android:test_runner_py"||g' "$target_file"
          echo "After:"
          grep -n 'test_runner_py\|data_deps' "$target_file" || true

          # gn's rust toolchain config asserts a host Linux sysroot exists.
          # Run the install script the error message points at.
          if [ -x "$v8_src/build/linux/sysroot_scripts/install-sysroot.py" ]; then
            python3 "$v8_src/build/linux/sysroot_scripts/install-sysroot.py" --arch=amd64
          else
            echo "install-sysroot.py not found at expected path" >&2
            exit 1
          fi

      - name: Build librusty_v8 from source
        id: build
        continue-on-error: true
        env:
          V8_FROM_SOURCE: "1"
          # rusty_v8 build.rs reads EXTRA_GN_ARGS. Disable the rust host build
          # tools toolchain - it's what triggers the chromium_crates_io vendor
          # tree (icu_calendar_data, etc.) that the v8 crate doesn't bundle.
          EXTRA_GN_ARGS: "enable_rust_host_build_tools = false"
        run: |
          set -o pipefail
          cargo ndk -t ${{ matrix.abi }} --platform 29 build --release 2>&1 \
            | tee /tmp/v8build.log

      - name: Show build log tail
        if: always()
        run: tail -n 200 /tmp/v8build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-build-log-${{ matrix.target }}
          path: /tmp/v8build.log
          if-no-files-found: ignore

      - name: Package archive
        id: package
        run: |
          lib=$(find target/${{ matrix.target }}/release -name librusty_v8.a | head -1)
          if [ -z "$lib" ]; then
            echo "librusty_v8.a was not produced" >&2
            exit 1
          fi
          out="librusty_v8_release_${{ matrix.target }}.a.gz"
          gzip -c "$lib" > "$out"
          ls -la "$out"
          echo "asset=$out" >> "$GITHUB_OUTPUT"

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: librusty_v8-v${{ steps.v8ver.outputs.version }}
          name: librusty_v8 ${{ steps.v8ver.outputs.version }} (Android)
          body: |
            Android static-lib prebuilts of librusty_v8 ${{ steps.v8ver.outputs.version }},
            built from source because denoland/rusty_v8 publishes none. Consumed by
            the Compile workflow via RUSTY_V8_ARCHIVE.
          files: ${{ steps.package.outputs.asset }}
